</script>
<style>
/* Layout: cabeçalho fixo com abas; conteúdo em cartões por número; roxo = Kids, azul = Teens & Adultos (as mesmas cores da grade de ensaios) */
:root{
  --bg:#F5F4FA;--surface:#FFFFFF;--ink:#1B1930;--muted:#625E7C;--line:#E0DDED;
  --kids:#6A3CD4;--kids-soft:#EEE8FC;--ta:#1A6DCE;--ta-soft:#E4EFFC;
  --warn:#9A4A06;--warn-soft:#FCEFD6;--ok:#12703F;--ok-soft:#DCF2E5;--pend:#6A6684;--pend-soft:#ECEAF3;
  --live:#D6246E;--live-soft:#FBE3EE;
  --f-head:'Space Grotesk',system-ui,sans-serif;--f-body:'Inter',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E0C1B;--surface:#171530;--ink:#EEEBFA;--muted:#A29DC0;--line:#2B2850;
  --kids:#B197FF;--kids-soft:#261E4B;--ta:#74B6FF;--ta-soft:#122846;
  --warn:#F5B65B;--warn-soft:#38280F;--ok:#5ED394;--ok-soft:#10301F;--pend:#A29DC0;--pend-soft:#25223F;
  --live:#FF6FA8;--live-soft:#42152B;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E0C1B;--surface:#171530;--ink:#EEEBFA;--muted:#A29DC0;--line:#2B2850;
  --kids:#B197FF;--kids-soft:#261E4B;--ta:#74B6FF;--ta-soft:#122846;
  --warn:#F5B65B;--warn-soft:#38280F;--ok:#5ED394;--ok-soft:#10301F;--pend:#A29DC0;--pend-soft:#25223F;
  --live:#FF6FA8;--live-soft:#42152B;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.wrap{max-width:1080px;margin:0 auto}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding:14px 0 0;border-bottom:1px solid var(--line)}
.top{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:flex-end;justify-content:space-between}
h1{font:700 26px/1.1 var(--f-head);margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13px;margin-top:4px}
.count{font:700 13px var(--f-head);color:var(--live);background:var(--live-soft);padding:5px 10px;border-radius:99px;white-space:nowrap}
.search{position:relative;width:100%;margin-top:12px}
