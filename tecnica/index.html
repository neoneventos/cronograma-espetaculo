:root{

:root[data-theme="dark"]{
  --bg:#0C0B16;--surface:#16152A;--ink:#EFEDFA;--muted:#A3A0C2;--line:#2A2850;--accent:#FF6FA8;--accent-soft:#42152B;
  --g1:#FF8DB8;--g1s:#40142B;--g2:#6EDBA0;--g2s:#0F2F1F;--g3:#7DB8FF;--g3s:#11264A;--g4:#F5B65B;--g4s:#38280F;--g0:#A3A0C2;--g0s:#24223D;
  --ok:#6EDBA0;--ok-soft:#0F2F1F;--warn:#F5B65B;--warn-soft:#38280F;color-scheme:dark}
*{box-sizing:border-box}

.wrap{max-width:1000px;margin:0 auto}

.top{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}

:root{--mt:#A3267F;--kids:#6A3CD4;--kids-soft:#EEE8FC;--tae:#1A6DCE;--tae-soft:#E4EFFC;--ms:#F6D5EE;--y:#8A6500;--ys:#FBF0C8;--yb:#E0A800;--r:#B3261E;--rs:#FCE2DF;--rb:#E5645A;--bl:#1A5FC2;--bls:#E2EDFB;--blb:#5B85F0;--gr:#12703F;--grs:#DCF2E5;--grb:#43B581;--c:#0B6B78;--cs:#D5F3F6;--cb:#56CBD8;--n:#4A4766;--ns:#ECEAF3;--nb:#A6A4BB}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--kids:#B197FF;--kids-soft:#261E4B;--tae:#74B6FF;--tae-soft:#122846;--ms:#3F1738;--mt:#F18AD6;--y:#F5C84B;--ys:#3A2F0E;--yb:#F5C84B;--r:#FF8A80;--rs:#43191A;--rb:#FF8A80;--bl:#7DB8FF;--bls:#11264A;--blb:#7DB8FF;--gr:#5ED394;--grs:#10301F;--grb:#5ED394;--c:#5FD3E0;--cs:#0E3237;--cb:#5FD3E0;--n:#C9C5E4;--ns:#25223F;--nb:#6A6684}}
:root[data-theme="dark"]{--kids:#B197FF;--kids-soft:#261E4B;--tae:#74B6FF;--tae-soft:#122846;--ms:#3F1738;--mt:#F18AD6;--y:#F5C84B;--ys:#3A2F0E;--yb:#F5C84B;--r:#FF8A80;--rs:#43191A;--rb:#FF8A80;--bl:#7DB8FF;--bls:#11264A;--blb:#7DB8FF;--gr:#5ED394;--grs:#10301F;--grb:#5ED394;--c:#5FD3E0;--cs:#0E3237;--cb:#5FD3E0;--n:#C9C5E4;--ns:#25223F;--nb:#6A6684}

.g4{--gc:var(--gr);--gs:var(--grs);--gb:var(--grb)}

.g1 .num,.num.g1,.chip.g1,.g2 .num,.num.g2,.chip.g2,.g3 .num,.num.g3,.chip.g3,.g4 .num,.num.g4,.chip.g4,.g5 .num,.num.g5,.chip.g5,.g6 .num,.num.g6,.chip.g6{background:var(--gs);color:var(--gc)}
.card.ch{border-top:4px solid var(--gb,var(--line))}
.num.two{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:6px 2px;line-height:1.1}
.num.two .l1{font:600 11px var(--f-body);letter-spacing:.04em}

.num.b36{background:linear-gradient(90deg,var(--rs) 25%,var(--ms) 0 50%,var(--ns) 0 75%,var(--cs) 0);color:var(--ink)}

.mg1{background:rgba(120,110,190,.14);border-color:rgba(120,110,190,.55)}
.mg2{background:rgba(50,150,150,.14);border-color:rgba(50,150,150,.55)}
.mg3{background:rgba(190,110,150,.14);border-color:rgba(190,110,150,.55)}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--g0s);color:var(--g0);margin-right:4px}
.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.ok{background:var(--ok-soft);color:var(--ok)}

td.c{text-align:center}
.dot{color:var(--g2);font-weight:700}.dot.w{color:var(--g4)}
.bar{height:8px;border-radius:99px;background:var(--g0s);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--g2)}
.chk{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.chk:last-child{border-bottom:0}

.chl .chk{padding:11px 12px}

.chk .bx{width:26px;height:26px;border:2px solid var(--muted);border-radius:8px;display:block;background:var(--surface);box-sizing:border-box}

.chk input{width:26px;height:26px}
.tbar{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}

.warnbox{border-color:var(--r);background:var(--rs);color:var(--r);margin:8px 0}
.chk .q{font:700 13px var(--f-head);color:var(--accent);margin-right:6px}
button{font:600 14px var(--f-body);padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}

.tl{display:grid;grid-template-columns:64px 1fr;gap:4px 12px}

/* cabos */
.tiles{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(104px,1fr))}
.tile{border-radius:12px;padding:10px 12px;border:1px solid var(--line);background:var(--surface);border-top:4px solid var(--tb)}

button.tile.on{background:var(--ts);border-color:var(--tb);box-shadow:0 0 0 2px var(--tb)}
.tpanel{margin-top:10px;border:1px solid var(--tb);border-radius:12px;background:var(--surface);overflow:hidden}
.tpanel .ph{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;background:var(--ts);color:var(--tc);font-weight:700}
.tpanel .ph button{font:inherit;border:0;background:none;color:inherit;font-size:18px;cursor:pointer;padding:0 4px}
.tpanel .pg{padding:7px 12px;font:700 12px var(--f-body);text-transform:uppercase;letter-spacing:.04em;color:var(--muted);background:var(--bg);border-top:1px solid var(--line);display:flex;justify-content:space-between}
.tile .tn{font:700 26px/1 var(--f-head);color:var(--tc)}.tile .tl2{font-weight:600;font-size:13px;margin-top:4px}.tile .ts{display:none}
.t1{--tc:var(--bl);--ts:var(--bls);--tb:var(--blb)}.t2{--tc:var(--kids);--ts:var(--kids-soft);--tb:var(--kids)}.t3{--tc:var(--y);--ts:var(--ys);--tb:var(--yb)}
.t4{--tc:var(--gr);--ts:var(--grs);--tb:var(--grb)}.t5{--tc:var(--c);--ts:var(--cs);--tb:var(--cb)}.t6{--tc:var(--n);--ts:var(--ns);--tb:var(--nb)}
.crs{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:6px}

.cr:first-child{border-top:0}

nda) nos canais 1 a 14.","Média","Feito na versão revisada"],["4","D13:D14","Os canais 11 e 12 dividem funções (backing, flauta e violino).","Regra: flauta no canal 11 e violino no 12 (mics de backing).","Alta","Feito na versão revisada"],["5","Canais 6, 8 e 10","Guitarra 2, Nylon/Uke e Teclado Sint são os coringas do sistema.","Sugestão de usos coringa retirada. Vale a cena como definida.","Alta","Descartado"],["6","D15:D16","Cantores aparecem como \"Fixo Frente\", mas em alguns números a voz está na posição do baixo ou da guitarra.","Anotado \"vai até o músico que também canta\" (Creep, Cavalcanti, Banda 10).","Média","Feito na versão revisada"],["7","A17:A18","Os dois apresentadores usam o Armer AX802, mas o AC só estava marcado em um.","Marcados os dois. Conferir se é um receptor duplo.","Baixa","Conferir"],["8","D19, H19","Música de Fundo sem conexão.","Cabo mini P2 para 2x P10, celular em \"Não perturbe\".","Média","Feito na versão revisada"],["9","D21:D26","As saídas AUX 1 a 6 estavam em branco.","AUX 1 e 2: monitores Antera MT350 passivos, via medusa e cabine, em XLR (fêmea na XR18, macho na medusa). AUX 3 a 6: reserva.","Alta","Resolvido na visita (04/11)"],["10","D27, H27","MAIN L/R sem tipo de conexão.","XLR até a medusa da casa, passando pela 01V (PAD ligado, ganho no mínimo, EQ flat). O \"2 LR P10\" das anotações não vale mais.","Alta","Resolvido na visita (04/11)"],["11","Total de DIs","O input list usa 7 DIs e a casa tem 4.","Levamos 9 (7 em uso e 2 de reserva). Os 4 da casa ficam de backup.","Média","Feito"],["12","Tensão (coluna G)","O técnico informou 110 V.","Conferir com o testador (a rede costuma ser 127 V) e a etiqueta de cada equipamento.","Média","Conferir no dia"],["13","Novo","Microfones da casa: 4 a 6 Shure (SM57 e SM58).","Decidir se são principais ou backup depois de ver as fotos e testar.","Média","A definir"],["14","Novo","Tomadas do palco: são 9 (4 à esquerda, 2 no fundo e 3 à direita), 110 V segundo o técnico.","Plano na aba \"Energi
